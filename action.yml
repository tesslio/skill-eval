name: 'Tessl Skill Eval'
description: 'Generate reviewable Tessl scenarios and run skill evals from PR changes or comments'
branding:
  icon: check-circle
  color: purple
inputs:
  enabled:
    description: 'Enable eval runs. Set to false to disable entirely.'
    default: 'true'
  skip-label:
    description: 'PR label that skips eval even when enabled. Set empty to disable.'
    default: 'skip-eval'
  path:
    description: 'Root path to search for SKILL.md files'
    default: '.'
  comment:
    description: 'Whether to post results as a PR comment'
    default: 'true'
  eval-workspace:
    description: 'Tessl workspace name. Optional when tiles have workspace set in tile.json.'
    default: ''
  eval-agent:
    description: 'Agent:model pair for evals (e.g. claude:claude-sonnet-4-6)'
    default: 'claude:claude-sonnet-4-6'
  eval-timeout:
    description: 'Max minutes to wait for each eval run to complete'
    default: '45'
  eval-runs:
    description: 'Number of times to repeat each agent configuration per scenario'
    default: '1'
  eval-fail-on-regression:
    description: 'Fail the check if any scenario scores worse with context than baseline'
    default: 'true'
  eval-generate-scenarios:
    description: 'Generate fresh scenarios before running evals'
    default: 'false'
  eval-scenario-count:
    description: 'Number of scenarios to generate per tile'
    default: '3'
  eval-commit-scenarios:
    description: 'Commit generated scenarios back to the PR branch (requires contents: write)'
    default: 'false'
  test-mode:
    description: 'Action development only: use mock scenario generation and mock eval results without calling Tessl APIs.'
    default: 'false'
  cli-version:
    description: 'Tessl CLI version to install (for example "0.x.y", or "latest")'
    default: 'latest'
  tessl-token:
    description: 'Tessl API token for authentication. Pass via secrets.'
    required: true
runs:
  using: 'composite'
  steps:
    - uses: oven-sh/setup-bun@v2
    - run: bun install --production --frozen-lockfile
      shell: bash
      working-directory: ${{ github.action_path }}
    - id: preflight
      run: bun ${{ github.action_path }}/src/preflight.ts
      shell: bash
      env:
        INPUT_ENABLED: ${{ inputs.enabled }}
        INPUT_SKIP_LABEL: ${{ inputs.skip-label }}
        GITHUB_TOKEN: ${{ github.token }}
    - id: setup-tessl
      if: steps.preflight.outputs.should-run == 'true' && inputs.test-mode != 'true'
      uses: tesslio/setup-tessl@v2
      with:
        version: ${{ inputs.cli-version }}
        token: ${{ inputs.tessl-token }}
    - run: bun ${{ github.action_path }}/src/main.ts
      if: steps.preflight.outputs.should-run == 'true'
      shell: bash
      env:
        INPUT_ENABLED: ${{ inputs.enabled }}
        INPUT_SKIP_LABEL: ${{ inputs.skip-label }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_EVAL_WORKSPACE: ${{ inputs.eval-workspace }}
        INPUT_EVAL_AGENT: ${{ inputs.eval-agent }}
        INPUT_EVAL_TIMEOUT: ${{ inputs.eval-timeout }}
        INPUT_EVAL_RUNS: ${{ inputs.eval-runs }}
        INPUT_EVAL_FAIL_ON_REGRESSION: ${{ inputs.eval-fail-on-regression }}
        INPUT_EVAL_GENERATE_SCENARIOS: ${{ inputs.eval-generate-scenarios }}
        INPUT_EVAL_SCENARIO_COUNT: ${{ inputs.eval-scenario-count }}
        INPUT_EVAL_COMMIT_SCENARIOS: ${{ inputs.eval-commit-scenarios }}
        INPUT_TEST_MODE: ${{ inputs.test-mode }}
        GITHUB_TOKEN: ${{ github.token }}
        TESSL_TOKEN: ${{ inputs.tessl-token }}
        TESSL_BIN: ${{ steps.setup-tessl.outputs.path }}
